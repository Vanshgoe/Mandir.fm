<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ॐ Shanti</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="page">


    <!-- Background -->

    <div class="background"></div>

    <div class="overlay"></div>



    <!-- Header -->

    <header>


        <div class="om">
            ॐ
        </div>



        <div class="time">

            <span id="clock">
                00:00:00
            </span>

            <br>

            <span id="location">
                Detecting location...
            </span>

        </div>



        <div class="hint">

            TAP • LISTEN • BREATHE

        </div>


    </header>





    <!-- Main Title -->


    <section class="hero">


        <h1>
            श्री
        </h1>


        <h1>
            मंदिर
        </h1>


    </section>





    <!-- Music Player -->


    <section class="player">


        <button
        class="play-button"
        id="playButton"
        aria-label="Play music">

            ▶

        </button>




        <div class="track-info">


            <div
            class="track-name"
            id="trackName">

                Loading...

            </div>



            <div
            class="artist"
            id="artist">

            </div>


        </div>





        <button
        class="next-button"
        id="nextButton"
        aria-label="Next song">


            ↠


        </button>



    </section>





    <!-- Hidden Playlist -->

    <div
    id="playlist"
    class="playlist">

    </div>






    <!-- Footer -->


    <footer>


        <span id="status">

            paused

        </span>


        <span>
            •
        </span>


        <span>

            ॐ शान्तिः

        </span>



    </footer>





</main>





<!-- Audio -->


<audio
id="audio"
preload="metadata">

</audio>




<script src="script.js"></script>


</body>

</html>
